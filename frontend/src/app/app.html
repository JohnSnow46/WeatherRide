<div class="shell">
  <header class="masthead">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="15" stroke="var(--color-primary)" stroke-width="1.5" opacity="0.35" />
        <circle cx="12.5" cy="12.5" r="4.5" fill="var(--color-accent-sun)" />
        <path
          d="M4 25c3-5 6-3 9-7s5-8 9-8 5 4.5 6 6.5"
          stroke="var(--color-primary)"
          stroke-width="2.25"
          stroke-linecap="round"
          fill="none"
        />
      </svg>
      <div class="brand-text">
        <h1>{{ title() }}</h1>
        <p class="tagline">Weather along the whole ride, not just start and finish.</p>
      </div>
    </div>
  </header>

  <main class="page">
    <aside class="page-sidebar">
      <app-route-plan-form />
    </aside>
    <div class="page-main">
      <app-route-map />
      <app-route-slider />
      <app-route-plan-result />
    </div>
  </main>

  <router-outlet />
</div>
